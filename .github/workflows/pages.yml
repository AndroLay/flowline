name: Deploy Flowline to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# A deployment in flight is never cancelled by the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` writes the site's build type, which the read-only default
    # at the top of this file does not allow.
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # pnpm has to exist before setup-node runs: `cache: pnpm` shells out to
      # `pnpm store path` inside setup-node's own step, and the runner image
      # ships Node and Yarn but not pnpm.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # The live site was hand-published to the `gh-pages` root, so the site's source is
      # still that branch, and `deploy-pages` takes a deployment from the source branch it
      # is configured with — a run on `main` would be turned away even with a runner. This
      # step moves the source to GitHub Actions. It sits after the gates deliberately: the
      # switch happens only in a run that already has something to serve. Its `base_path`
      # output is unused, for the reason on the next step.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # `base` is relative in vite.config.ts, so the bundle resolves its own
      # assets from whatever subpath Pages serves it on.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
